<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Client M tracking architecture (template)</title>
  <rect width="980" height="430" fill="#FFFFFF"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker>
  </defs>
  <!-- consent band -->
  <rect x="20" y="20" width="940" height="34" rx="8" fill="#FDF1D6" stroke="#EDA100"/>
  <text x="34" y="42" fill="#0B0B0B"><tspan font-weight="600">Consent first:</tspan> defaults all denied on Consent Initialization → banner choice → consent update → each tag fires only with its consent types</text>
  <!-- browser -->
  <rect x="20" y="80" width="200" height="150" rx="10" fill="#F3F1EC" stroke="#A3A19A"/>
  <text x="34" y="104" font-weight="600" fill="#0B0B0B">Browser (website)</text>
  <text x="34" y="126" fill="#52514E">dataLayer events</text>
  <text x="34" y="144" fill="#52514E">(tracking plan + JSON Schema,</text>
  <text x="34" y="162" fill="#52514E">tested by Playwright)</text>
  <text x="34" y="186" fill="#52514E">event_id created here</text>
  <text x="34" y="204" fill="#52514E">purchase once per transaction_id</text>
  <!-- web container -->
  <rect x="260" y="80" width="210" height="150" rx="10" fill="#E8F1FC" stroke="#2A78D6"/>
  <text x="274" y="104" font-weight="600" fill="#0B0B0B">GTM web container</text>
  <text x="274" y="126" fill="#52514E">Google tag (GA4)</text>
  <text x="274" y="144" fill="#52514E">Google Ads conversion + linker</text>
  <text x="274" y="162" fill="#52514E">Meta pixel (eventID)</text>
  <text x="274" y="180" fill="#52514E">LinkedIn Insight (event_id)</text>
  <text x="274" y="204" fill="#52514E">cross-domain: shop + payment</text>
  <!-- tag gateway -->
  <rect x="260" y="260" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#2A78D6" stroke-dasharray="5 4"/>
  <text x="274" y="284" font-weight="600" fill="#0B0B0B">Google tag gateway</text>
  <text x="274" y="304" fill="#52514E">Google tag served from the</text>
  <text x="274" y="322" fill="#52514E">site's own domain (CDN / LB)</text>
  <!-- server -->
  <rect x="510" y="80" width="210" height="260" rx="10" fill="#E8F1FC" stroke="#2A78D6"/>
  <text x="524" y="104" font-weight="600" fill="#0B0B0B">GTM server container</text>
  <text x="524" y="124" fill="#52514E">metrics.&lt;client domain&gt;</text>
  <text x="524" y="150" fill="#52514E">GA4 client</text>
  <text x="524" y="172" fill="#52514E">→ GA4 tag</text>
  <text x="524" y="194" fill="#52514E">→ Google Ads conversion</text>
  <text x="524" y="216" fill="#52514E">→ Meta Conversions API</text>
  <text x="524" y="238" fill="#52514E">→ LinkedIn Conversions API</text>
  <text x="524" y="266" fill="#D03B3B" font-weight="600">reuse the browser event_id</text>
  <text x="524" y="286" fill="#D03B3B">never create a new one</text>
  <text x="524" y="316" fill="#52514E">hourly error-rate monitoring</text>
  <!-- destinations -->
  <g>
    <rect x="770" y="80" width="190" height="44" rx="8" fill="#F3F1EC" stroke="#A3A19A"/><text x="784" y="107" fill="#0B0B0B">GA4 property</text>
    <rect x="770" y="134" width="190" height="44" rx="8" fill="#F3F1EC" stroke="#A3A19A"/><text x="784" y="161" fill="#0B0B0B">Google Ads</text>
    <rect x="770" y="188" width="190" height="44" rx="8" fill="#F3F1EC" stroke="#A3A19A"/><text x="784" y="215" fill="#0B0B0B">Meta (dedup on event_id)</text>
    <rect x="770" y="242" width="190" height="44" rx="8" fill="#F3F1EC" stroke="#A3A19A"/><text x="784" y="269" fill="#0B0B0B">LinkedIn</text>
    <rect x="770" y="296" width="190" height="44" rx="8" fill="#F3F1EC" stroke="#A3A19A"/><text x="784" y="323" fill="#0B0B0B">CM360 (Floodlight)</text>
  </g>
  <!-- arrows -->
  <line x1="220" y1="155" x2="256" y2="155" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="130" x2="506" y2="130" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="365" y1="230" x2="365" y2="256" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="185" x2="766" y2="210" stroke="#A3A19A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="720" y1="102" x2="766" y2="102" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="720" y1="156" x2="766" y2="156" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="720" y1="210" x2="766" y2="210" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="720" y1="264" x2="766" y2="264" stroke="#52514E" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="210" x2="766" y2="318" stroke="#A3A19A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="560" y="372" fill="#52514E">solid: server-side delivery · dashed: browser tags (pixel, Floodlight) · same event_id on both paths</text>
  <text x="20" y="410" fill="#898781" font-size="11">Template for a fictional client (SIMULATED). Placeholder ids only. Sources: Google tag gateway, Meta deduplication, GA4 Measurement Protocol pages (read 2026-11-25).</text>
</svg>
